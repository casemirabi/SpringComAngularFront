<form action="">

    <img src="cliente.png">
    <input type="text" placeholder="Nome" class="form-control" name="nome" [(ngModel)]="cliente.nome">
    <input type="number" placeholder="Idade" class="form-control" name="idade" [(ngModel)]="cliente.idade">
    <input type="text" placeholder="Cidade" class="form-control" name="cidade" [(ngModel)]="cliente.cidade">

    <input type="button" value="Cadastrar" class="btn btn-primary" (click)="cadastrar()">
    <input type="button" value="Atualizar" class="btn btn-warning">
    <input type="button" value="Remover" class="btn btn-danger">
    <input type="button" value="Cancelar" class="btn btn-secondary">
</form>

<table class="table">
    <thead>
        <tr>
            <th>#</th>
            <th>Nome</th>
            <th>Idade</th>
            <th>Cidade</th>
            <th>Seleção</th>
        </tr>
    </thead>
    <tbody></tbody>
</table>
